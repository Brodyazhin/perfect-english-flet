name: Build Flet APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet CLI
        run: |
          pip install flet-cli

      - name: Verify Flet
        run: |
          flet --version

      - name: Build APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: "1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perfect-english-apk
          path: build/app/outputs/**/*.apk
          if-no-files-found: error
