name: Build Flet APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Создаем виртуальное окружение и ставим flet-cli
      - name: Install Flet CLI
        run: |
          uv venv
          uv pip install flet-cli

      - name: Verify Flet
        run: |
          # Активируем окружение и проверяем версию
          source .venv/bin/activate
          flet --version

      - name: Build APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: "1"

      - name: Collect APKs
        run: |
          mkdir -p final_apks
          find . -name "*.apk" -type f -exec cp {} final_apks/ \;
          echo "Найдено APK файлов:"
          ls -la final_apks/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perfect-english-apk
          path: final_apks/*.apk
          if-no-files-found: error
