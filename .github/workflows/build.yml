name: Build Flet APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet CLI
        run: |
          pip install flet-cli

      - name: Verify Flet
        run: |
          flet --version

      # Очищаем кэш, чтобы Flet не использовал битые файлы
      - name: Clear Flet Cache
        run: |
          rm -rf ~/.flet/cache

      - name: Build APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: "1"

      # Собираем все APK в одну папку (на случай, если Flet сохранит его не туда)
      - name: Collect APKs
        run: |
          mkdir -p final_apks
          find . -name "*.apk" -type f -exec cp {} final_apks/ \;
          echo "Найдено APK файлов:"
          ls -la final_apks/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perfect-english-apk
          path: final_apks/*.apk
          if-no-files-found: error
